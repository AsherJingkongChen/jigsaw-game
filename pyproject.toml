[project]
name = "jigsaw"
version = "0.1.0"
description = "Patch-shuffle jigsaw: assemble hides a permutation in a PNG, dessemble scores a guess"
readme = "README.md"
license = "MIT"
authors = [
    { name = "AsherJingkongChen", email = "37398747+AsherJingkongChen@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
assemble = "jigsaw:assemble"
dessemble = "jigsaw:dessemble"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
